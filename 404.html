<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Alwardi Group</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <style>
    :root { --dark: #121212; --light: #F2F1EE; --accent: #C8102E; --accent-hover: #DE1F3E; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--dark);
      color: var(--light);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    img { width: 120px; height: auto; margin-bottom: 36px; }
    p.code { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .2em; color: #EF4135; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 48px); line-height: 1.05; text-transform: uppercase; letter-spacing: -.01em; }
    p { margin: 0 0 32px; color: rgba(242, 241, 238, .7); line-height: 1.6; }
    a.btn {
      display: inline-flex; align-items: center; gap: 10px;
      height: 52px; padding: 0 26px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
      transition: background .3s;
    }
    a.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/alwardi-logo-light.webp" alt="Alwardi Group" width="274" height="200">
